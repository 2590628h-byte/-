<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  .flag {
    width: 300px;
    height: 200px;
    background-color: white;
    border: 1px solid lightgray;
    display: flex;
    justify-content: center;
    align-items: center;
  }
   .flag2 {
    width: 300px;
    height: 200px;
    background-color:lightblue;
    border: 1px solid lightgray;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .circle {
    width: 120px;
    height: 120px;
    background-color: red;
    border-radius: 50%;
  }
  .circle2 {
    width: 120px;
    height: 120px;
    background-color: yellow;
    border-radius: 50%;
     transform: translateX(-15px);
  }
</style>
</head>
<body>

<div class="flag">
  <div class="circle"></div>
</div>

</body>

<body>

<div class="flag2">
  <div class="circle2"></div>
</div>
